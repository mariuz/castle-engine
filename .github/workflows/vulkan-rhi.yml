# ----------------------------------------------------------------------------
# GitHub Action workflow for Castle Game Engine Vulkan RHI CI Gate:
# - Compiles vkxml2pas, castle-engine build tool, Vulkan examples, and castle_tester_standalone
# - Runs all TTestCastleVulkanRHI tests (including side-by-side rbOpenGL vs rbVulkan
#   perceptual RMSE visual regression suite) under Xvfb + Mesa Lavapipe +
#   VK_LAYER_KHRONOS_validation (CASTLE_VULKAN_VALIDATION=1)
# - Verifies castle-engine package automatic SPIR-V shader_cache bundling
# ----------------------------------------------------------------------------

name: Vulkan RHI & Visual Regression Gate

on:
  push:
    branches:
      - vulkan-renderer
      - master
  pull_request:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  vulkan-rhi-linux:
    name: Vulkan RHI + Validation Layer + OpenGL vs Vulkan Visual Regression (Ubuntu Lavapipe)
    runs-on: ubuntu-latest
    env:
      CASTLE_VULKAN_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install FPC+Lazarus
        run: |
          cd /tmp/
          git clone https://github.com/castle-engine/castle-build-ci.git --depth=1 --single-branch --branch=master
          castle-build-ci/install_dependencies
          castle-build-ci/setup_castle_engine --install-castle-engine=false --install-fpc=true --install-lazarus=false
      - name: Install Vulkan Loader, Mesa Lavapipe, Validation Layers, libshaderc & glslang
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends -y install \
            libgl-dev libx11-dev libxmu-dev libxxf86vm-dev xvfb xauth \
            libvulkan1 libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools \
            libshaderc1 glslang-tools
      - name: Set environment
        run: echo "CASTLE_ENGINE_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Verify Vulkan Loader & Khronos Validation Layer Discovery
        run: vulkaninfo --summary
      - name: Compile vkxml2pas Generator
        run: fpc -Mobjfpc -Sh tools/internal/generate_vulkan_api/vkxml2pas.dpr
      - name: Compile castle-engine Build Tool
        run: ./tools/build-tool/castle-engine_compile.sh
      - name: Package Vulkan 3D Scene & Verify Bundled SPIR-V Shader Cache
        run: |
          ./tools/build-tool/castle-engine --project ./examples/vulkan/vulkan_3d_scene/ compile --compiler-option=-dCASTLE_WINDOW_XLIB
          ./tools/build-tool/castle-engine --project ./examples/vulkan/vulkan_3d_scene/ package --package-format=directory --fast
          ls -la ./examples/vulkan/vulkan_3d_scene/vulkan_3d_scene-1.0.0-linux-x86_64/data/shader_cache/
          test -n "$(ls -A ./examples/vulkan/vulkan_3d_scene/vulkan_3d_scene-1.0.0-linux-x86_64/data/shader_cache/*.spv)"
      - name: Run Headless Vulkan Examples & CLI Override under Validation Gate
        run: |
          ./tools/build-tool/castle-engine --project ./examples/vulkan/vulkan_triangle/ compile --compiler-option=-dCASTLE_WINDOW_XLIB
          ./examples/vulkan/vulkan_triangle/vulkan_triangle --headless --render-backend=vulkan
          ./tools/build-tool/castle-engine --project ./examples/vulkan/vulkan_sprite_batch/ compile --compiler-option=-dCASTLE_WINDOW_XLIB
          ./examples/vulkan/vulkan_sprite_batch/vulkan_sprite_batch --headless --render-backend=vulkan
          ./examples/vulkan/vulkan_3d_scene/vulkan_3d_scene --headless --render-backend=vulkan
      - name: Run TTestCastleVulkanRHI Suite (libshaderc + glslang + Flagship Demos + OpenGL vs Vulkan Visual Regression)
        run: |
          ./tools/build-tool/castle-engine --project ./tests/ compile --mode=debug --compiler-option=-dCASTLE_WINDOW_XLIB
          xvfb-run -a ./tools/build-tool/castle-engine --project ./tests/ run -- --console --filter=TTestCastleVulkanRHI*
          CASTLE_SHADER_COMPILER=builtin xvfb-run -a ./tools/build-tool/castle-engine --project ./tests/ run -- --console --filter=TTestCastleVulkanRHI.TestBuiltInSPIRVCoreShadersAndRealLavapipeDrawPrimitive2DRHI
